org.gradle.jvmargs=-Xmx3g
android.useAndroidX=true
kotlin.code.style=official
# iOS targets are declared but can only be built on a Mac.
kotlin.native.ignoreDisabledTargets=true

# Kotlin 2.3+ writes packageManager "yarn@npm@<ver>" for its yarn setup, which yarn 1 rejects; npm has no such check.
kotlin.js.yarn=false
