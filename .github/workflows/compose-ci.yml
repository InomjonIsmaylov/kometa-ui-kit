name: Compose kit checks

# Every push and pull request that touches the Compose port: unit and render tests, the public-API check
# (apiCheck), and the iOS compile, which only a Mac can do. Releases run the same check in publish-compose.yml.
on:
  push:
    branches: [main]
    paths: ['compose/**', '.github/workflows/compose-ci.yml']
  pull_request:
    paths: ['compose/**', '.github/workflows/compose-ci.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: compose
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :kometa-ui:check :kometa-ui:compileKotlinIosArm64 :sample:assembleDebug
