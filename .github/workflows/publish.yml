name: Publish to npm

# Push a tag like v0.1.0 whose number matches projects/kometa-ui/package.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package version
        run: test "v$(node -p "require('./projects/kometa-ui/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npm publish --provenance --access public
        working-directory: dist/kometa-ui
