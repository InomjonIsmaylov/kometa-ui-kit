name: Signing secrets check (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
      PASS: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
      KID: ${{ secrets.MAVEN_SIGNING_KEY_ID }}
    steps:
      - run: |
          echo "key length ${#KEY}, lines $(printf '%s\n' "$KEY" | wc -l), CR present: $(printf '%s' "$KEY" | grep -c $'\r' || true)"
          printf '%s\n' "$KEY" | head -1
          echo "pass length ${#PASS}; key id length ${#KID}"
          export GNUPGHOME=$(mktemp -d)
          printf '%s\n' "$KEY" | gpg --batch --import 2>&1 | tail -2
          gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print "fpr ends " substr($10,33); exit}'
          echo hi | gpg --batch --pinentry-mode loopback --passphrase "$PASS" --clearsign >/dev/null 2>&1 && echo "passphrase OK" || echo "passphrase FAILED"
