name: Publish Compose kit to GitHub Packages

# Push a tag like compose-v0.1.0 whose number matches `version` in compose/kometa-ui/build.gradle.kts.
# (The npm workflow takes `v*` tags, which a `compose-v*` tag does not match.)
on:
  push:
    tags: ['compose-v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # macOS, because the iOS artifacts can only be built there; without them the published
    # module metadata would point at iOS variants that do not exist.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: compose
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Tag matches the Gradle version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' kometa-ui/build.gradle.kts)
          test "compose-v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, but build.gradle.kts says $version"; exit 1; }
      - run: ./gradlew :kometa-ui:desktopTest
      - run: ./gradlew :kometa-ui:publishAllPublicationsToGitHubPackagesRepository
        env:
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
