name: Publish Compose kit to Maven Central

# Push a tag like compose-v0.1.0 whose number matches `version` in compose/kometa-ui/build.gradle.kts.
# (The npm workflow takes `v*` tags, which a `compose-v*` tag does not match.)
on:
  push:
    tags: ['compose-v*']

permissions:
  contents: read

jobs:
  publish:
    # macOS, because the iOS artifacts can only be built there; without them the published
    # module metadata would point at iOS variants that do not exist.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: compose
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # No setup-android: the macOS runner image ships the SDK (ANDROID_HOME), and setup-android@v3
      # fails there asking sdkmanager for the long-gone 'tools' package.
      - uses: gradle/actions/setup-gradle@v5
      - name: Tag matches the Gradle version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' kometa-ui/build.gradle.kts)
          test "compose-v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, but build.gradle.kts says $version"; exit 1; }
      - run: ./gradlew :kometa-ui:check
      # Secrets come from compose/scripts/setup-release-secrets.sh. automaticRelease: the deployment is
      # released once Central validates it, so the version is public minutes later (it can never be removed).
      - run: ./gradlew :kometa-ui:publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.MAVEN_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
